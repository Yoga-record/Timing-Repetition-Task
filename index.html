<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時間知覚計測タスク</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 18px;
            color: #2d3748;
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .instruction {
            font-size: 13px;
            color: #e53e3e;
            background-color: #fff5f5;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #fed7d7;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: left;
        }

        #patientIdDisplay {
            font-size: 14px;
            color: #718096;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* 指で隠れない位置（ボタンの上）に表示される妨害数字エリア */
        #distractorContainer {
            width: 100%;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        #distractorText {
            font-size: 72px;
            font-weight: 800;
            color: #4f46e5;
            line-height: 1;
        }

        /* 大きな円形ボタン */
        #timerButton {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #4f46e5;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
            cursor: pointer;
            outline: none;
            transition: transform 0.1s, background-color 0.2s;
            -webkit-touch-callout: none;
        }

        #timerButton:active {
            transform: scale(0.96);
            background-color: #4338ca;
        }

        #message {
            margin-top: 30px;
            font-size: 15px;
            font-weight: 500;
            color: #4a5568;
            min-height: 24px;
        }

        /* 質問エリアのスタイル */
        #surveyArea {
            background: white;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            box-sizing: border-box;
            text-align: left;
        }

        .survey-question {
            font-size: 15px;
            font-weight: bold;
            color: #2d3748;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .survey-btn {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            background-color: #fff;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .survey-btn:active {
            background-color: #f7fafc;
            border-color: #cbd5e0;
        }
    </style>
</head>
<body>

    <div class="container" id="taskScreen">
        <h1>感覚で「3秒間」ボタンを押し続けてください</h1>
        
        <div class="instruction">
            【重要（数を数えないでください）】<br>
            頭の中で「1、2、3」と数えると実験データが壊れてしまいます。押している間は、声を出して「あ、あ、あ、あ…」と言い続けながら、体感の感覚だけで3秒を測ってください。
        </div>

        <div id="patientIdDisplay">ID: 読み込み中...</div>
        
        <div id="distractorContainer">
            <span id="distractorText"></span>
        </div>
        
        <button id="timerButton">ここを長押し</button>
        
        <p id="message">ボタンを押すと計測が始まります</p>
    </div>

    <div class="container" id="surveyScreen" style="display: none;">
        <div id="surveyArea">
            <div class="survey-question">
                今日、あなたの身体に何らかの傷（カッティング, 引っかき傷, ぶつけた痕など）がつきましたか？
            </div>
            <button class="survey-btn" id="btnYes">はい（傷がついた）</button>
            <button class="survey-btn" id="btnNo">いいえ（傷はついていない）</button>
        </div>
    </div>

    <div class="container" id="thanksScreen" style="display: none;">
        <p style="font-size: 18px; font-weight: bold; color: #10b981;">
            本日の計測が完了しました！<br>ご協力ありがとうございました。
        </p>
    </div>

    <script>
        let startTime = 0;
        let calculatedDurationMs = 0; 
        let distractorIntervalId = null;
        
        const button = document.getElementById('timerButton');
        const distractorText = document.getElementById('distractorText');
        const message = document.getElementById('message');
        const idDisplay = document.getElementById('patientIdDisplay');

        const taskScreen = document.getElementById('taskScreen');
        const surveyScreen = document.getElementById('surveyScreen');
        const thanksScreen = document.getElementById('thanksScreen');

        // URLパラメータからのID取得
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('id');
        idDisplay.innerText = patientId ? "参加者ID: " + patientId : "※参加者IDが未設定です";
        if (!patientId) idDisplay.style.color = "#e53e3e";

        function startDistractor() {
            function changeNumber() {
                distractorText.innerText = Math.floor(Math.random() * 10);
                const nextTimeout = Math.floor(Math.random() * 201) + 200;
                distractorIntervalId = setTimeout(changeNumber, nextTimeout);
            }
